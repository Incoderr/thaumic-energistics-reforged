plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

repositories {
    maven { url = "https://maven.theillusivec4.top/" }
    maven {
        name = "Minecraft Forge"
        url = "https://maven.minecraftforge.net/"
        content {
            includeGroup "com.github.glitchfiend"
        }
    }
    maven {
        name = "shedaniel"
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
        }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }
}

base {
    archivesName = "thaumic-energistics-reforged"
}

tasks.named('jar', Jar) {
    archiveFileName = "thaumic-energistics-reforged-${mod_version}-${minecraft_version}.jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = "1.21.1"
        mappingsVersion = "2024.11.17"
    }

    runs {
        client {
            client()
            gameDirectory = file("run/client")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            gameDirectory = file("run/server")
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file("run/gametest")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "thaumcraft:thaumcraft-4-reforged:${thaumcraft_version}"
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
    implementation files("libs/appliedenergistics2-${ae2_version}.jar")
    implementation files("libs/guideme-${guideme_version}.jar")
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    if (!providers.gradleProperty("withoutRei").isPresent()) {
        localRuntime "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            thaumcraft_version     : thaumcraft_version,
            ae2_version            : ae2_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('runServer') {
    standardInput = System.in
}

tasks.matching { it.name.startsWith("prepare") && it.name.endsWith("Run") }.configureEach {
    outputs.cacheIf { false }
}

def gameTestLog = layout.projectDirectory.file("run/gametest/logs/latest.log").asFile
def gameTestProperties = layout.projectDirectory.file("run/gametest/server.properties").asFile
tasks.named('runGameTestServer') {
    doFirst {
        gameTestLog.delete()
        gameTestProperties.parentFile.mkdirs()
        if (!gameTestProperties.exists()) {
            gameTestProperties.text = ""
        }
    }
    doLast {
        def log = gameTestLog
        if (!log.isFile() || !log.text.contains("Enabled Gametest Namespaces: [thaumicenergistics]") || !(log.text =~ /All [1-9][0-9]* required tests passed/)) {
            throw new GradleException("GameTest server did not report a completed successful test run")
        }
    }
}
